<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>

    <!-- Accent Glowing Gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    .pulse-node {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: flowDash 20s linear infinite;
    }
    .floating-card-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatMedium 5s ease-in-out infinite alternate;
    }
    .glow-orb-1 {
      animation: orbDrift 8s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: orbDrift 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes flowDash {
      to { stroke-dashoffset: -320; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; r: 4px; }
      100% { opacity: 0.9; r: 7px; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatMedium {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes orbDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, 20px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #64748b;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g>
    <line x1="80" y1="0" x2="80" y2="420" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="420" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="420" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="420" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="420" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="420" class="grid-line" />
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in the background -->
  <circle cx="150" cy="100" r="240" fill="url(#glowCyan)" class="glow-orb-1" />
  <circle cx="1050" cy="300" r="280" fill="url(#glowPurple)" class="glow-orb-2" />

  <!-- Animated Neural / Knowledge Graph Flow Lines in Background -->
  <g opacity="0.6">
    <path d="M 650 330 C 800 330, 850 180, 1020 180" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <path d="M 680 350 C 780 350, 880 280, 1060 280" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <path d="M 820 120 C 920 120, 960 220, 1100 220" fill="none" stroke="#a855f7" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Dynamic Knowledge Graph Nodes (Positioned away from text) -->
  <g opacity="0.85">
    <circle cx="780" cy="220" r="5" fill="#38bdf8" class="pulse-node" />
    <circle cx="890" cy="160" r="6" fill="#818cf8" class="pulse-node" />
    <circle cx="980" cy="260" r="5" fill="#c084fc" class="pulse-node" />
    <circle cx="1080" cy="180" r="6" fill="#38bdf8" class="pulse-node" />
    <circle cx="850" cy="320" r="4" fill="#a855f7" class="pulse-node" />
  </g>

  <!-- Subtle Dynamic Tech Glass Cards in Background Right (stays clear of title/subtitle) -->
  <g class="floating-card-1" opacity="0.8">
    <rect x="830" y="70" width="280" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="860" cy="100" r="10" fill="#38bdf8" opacity="0.2" />
    <circle cx="860" cy="100" r="5" fill="#38bdf8" />
    <text x="885" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Hybrid RAG &amp; GraphQA</text>
    <text x="885" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Semantic Chunks • Dense Vectors</text>
    <rect x="885" y="136" width="180" height="4" rx="2" fill="#1e293b" />
    <rect x="885" y="136" width="125" height="4" rx="2" fill="url(#accentBlue)" />
  </g>

  <g class="floating-card-2" opacity="0.8">
    <rect x="860" y="220" width="270" height="85" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="890" cy="250" r="10" fill="#a855f7" opacity="0.2" />
    <circle cx="890" cy="250" r="5" fill="#a855f7" />
    <text x="915" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Enterprise Permissions</text>
    <text x="915" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">RBAC • Inline Citations</text>
  </g>

  <!-- FOREGROUND BRANDING AREA (Unobstructed, Crystal Clear) -->
  <g transform="translate(80, 85)">
    <!-- Top Category Badge Pill -->
    <rect x="0" y="0" width="245" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">ENTERPRISE AI &amp; RAG STACK</text>

    <!-- Main Title (Gradiente + Foreground) -->
    <text x="0" y="75" class="title-text" fill="url(#textGrad)">Awesome AI Knowledge Base</text>
    <text x="0" y="125" class="title-text" fill="#ffffff">&amp; LLM QA Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">Curated Enterprise Search, RAG Workspaces &amp; Graph Knowledge Engines</text>
    <text x="0" y="190" class="tagline-text">Self-Hosted Turnkey Solutions • SaaS Enterprise Search • Sovereign Local QA</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 220)">
      <!-- Pill 1: Turnkey RAG -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="62" y="19" class="pill-text" text-anchor="middle">⚡ Turnkey RAG</text>
      </g>

      <!-- Pill 2: GraphRAG -->
      <g transform="translate(135, 0)">
        <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="65" y="19" class="pill-text" text-anchor="middle">🕸️ GraphRAG</text>
      </g>

      <!-- Pill 3: Enterprise Search -->
      <g transform="translate(275, 0)">
        <rect x="0" y="0" width="155" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="77" y="19" class="pill-text" text-anchor="middle">🔍 Enterprise Search</text>
      </g>

      <!-- Pill 4: Self-Hosted -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="67" y="19" class="pill-text" text-anchor="middle">🛡️ 100% Private</text>
      </g>
    </g>
  </g>
</svg>